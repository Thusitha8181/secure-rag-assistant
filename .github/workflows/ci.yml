name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # action-setup reads packageManager from the repo-root package.json;
          # this app keeps it in frontend/package.json, so pin the version here.
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  terraform-fmt:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform

  evals:
    name: Fast eval gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, terraform-fmt]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "false"
      JWT_SECRET: ci-jwt-not-for-production
      EVAL_DELAY_S: "0.4"
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Groq is not configured
        if: ${{ env.GROQ_API_KEY == '' }}
        run: |
          echo "::warning::GROQ_API_KEY is not set; skipping the compose eval gate."
          echo "Set the repository secret so PRs cannot merge a broken RAG pipeline."
      - uses: docker/setup-buildx-action@v3
        if: ${{ env.GROQ_API_KEY != '' }}
      - name: Write compose .env (gitignored)
        if: ${{ env.GROQ_API_KEY != '' }}
        run: |
          {
            echo "GROQ_API_KEY=${GROQ_API_KEY}"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "LANGSMITH_API_KEY=${LANGSMITH_API_KEY}"
            echo "LANGSMITH_TRACING=false"
          } > .env
      - name: Build and start the local stack
        if: ${{ env.GROQ_API_KEY != '' }}
        run: docker compose up -d --build --wait qdrant dynamodb backend
      - name: Ingest company documents
        if: ${{ env.GROQ_API_KEY != '' }}
        run: docker compose --profile tools run --rm ingest
      - uses: astral-sh/setup-uv@v5
        if: ${{ env.GROQ_API_KEY != '' }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: evals/uv.lock
      - name: Run the fast eval suite
        if: ${{ env.GROQ_API_KEY != '' }}
        working-directory: evals
        run: |
          uv sync --frozen
          uv run python run_evals.py --api-url http://localhost:8000 --suite fast
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 backend ingest || true
      - name: Stop the stack
        if: always() && env.GROQ_API_KEY != ''
        run: docker compose down -v
