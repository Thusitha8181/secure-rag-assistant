[project]
name = "secure-rag-evals"
version = "0.1.0"
description = "Black-box evaluation suite (Ragas + security gates) for the Secure RAG Assistant API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ragas>=0.4",
    # ragas 0.4 still imports modules removed in langchain-community 0.4
    "langchain-community>=0.3,<0.4",
    # Groq's OpenAI-compatible endpoint serves as the Ragas judge
    "openai>=1.40",
    "fastembed>=0.4",
    "langsmith>=0.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["harness"]
