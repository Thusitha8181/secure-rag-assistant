[project]
name = "secure-rag-evals"
version = "0.1.0"
description = "Black-box evaluation suite (Ragas + security gates) for the Secure RAG Assistant API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ragas>=0.4",
    # ragas 0.4 still imports modules removed in langchain-community 0.4
    "langchain-community>=0.3,<0.4",
    "langchain-groq",
    "fastembed>=0.4",
    "langsmith>=0.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.0",
]

[tool.uv]
package = false
